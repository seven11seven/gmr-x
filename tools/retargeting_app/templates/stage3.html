<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GMR · Stage 3 — Aux Links</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <link rel="stylesheet" href="/static/app.css?v=stage3-aux-1" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">GMR</span>
      <div>
        <h1>Stage 3 · Aux Links</h1>
        <p>微调 XML 中 aux_* 辅助点的相对坐标，对齐骨骼</p>
      </div>
    </div>
    <div class="stepper">
      <a class="step" href="/">1 Mapping</a>
      <a class="step" href="/stage2">2 Scale / Offset</a>
      <span class="step active">3 Aux</span>
      <a class="step" href="/stage4">4 Weights</a>
      <a class="step" href="/stage5">5 Retarget</a>
    </div>
  </header>

  <main class="layout stage3-layout">
    <aside class="panel panel-col">
      <section class="card">
        <h2>输入 / 重载</h2>
        <label>Robot XML
          <select id="xmlSelect"></select>
        </label>
        <label>BVH 文件
          <select id="bvhSelect"></select>
        </label>
        <label>IK Config（可选，用于人类骨骼对比）
          <select id="configSelect"></select>
        </label>
        <label>BVH 单位制
          <select id="bvhUnit"></select>
        </label>
        <div class="row">
          <button id="btnReload" class="primary" type="button">重新加载</button>
        </div>
        <p class="hint" id="loadHint" style="margin-top:0.45rem;"></p>
      </section>

      <section class="card">
        <h2>机器人平移（显示）</h2>
        <p class="hint">仅影响可视化，不写入 XML</p>
        <div class="translate-grid">
          <button type="button" data-axis="y" data-dir="1">← Y+</button>
          <button type="button" data-axis="x" data-dir="1">↑ X+</button>
          <button type="button" data-axis="y" data-dir="-1">→ Y-</button>
          <button type="button" data-axis="x" data-dir="-1">↓ X-</button>
          <button type="button" data-axis="z" data-dir="1">Z+</button>
          <button type="button" data-axis="z" data-dir="-1">Z-</button>
        </div>
        <div class="row" style="margin-top:0.5rem; align-items:center;">
          <label style="margin:0; flex:1;">步长 (m)
            <input id="transStep" type="text" value="0.05" />
          </label>
          <button id="btnTransReset" class="ghost" type="button">复位</button>
        </div>
        <p class="hint" id="transPos">(0.00, 0.00, 0.00)</p>
      </section>

      <section class="card">
        <h2>保存 XML</h2>
        <label class="check">
          <input id="overwriteXml" type="checkbox" checked />
          覆盖当前 Robot XML
        </label>
        <label>另存为（取消覆盖时）
          <input id="saveName" type="text" placeholder="D20_aux_tuned.xml" />
        </label>
        <div class="row">
          <button id="btnSave" class="primary" type="button">保存修改后的 XML</button>
        </div>
        <p class="status" id="saveStatus"></p>
      </section>
    </aside>

    <aside class="panel panel-col">
      <section class="card card-fill">
        <div class="card-head">
          <h2>辅助点 local pos</h2>
          <span class="hint" style="margin:0;">相对父 link · m</span>
        </div>
        <p class="hint">修改 xyz 后自动刷新骨架；点击图中 aux_* 可定位条目</p>
        <div id="auxList" class="param-list param-list-fill"></div>
      </section>
    </aside>

    <section class="viewport stage3-viewport">
      <div id="plot"></div>
    </section>
  </main>

  <script src="/static/stage3.js?v=stage3-aux-1"></script>
</body>
</html>
